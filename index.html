<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>To do list</title>
</head>
<body>
    <header>
        <div class="contentheader">
            <h1>Qevra tasks</h1>
            <ul>
                <li><a href="index.html"><strong>Home</strong></a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Sign</a></li>
            </ul>
        </div>
    </header>
    <main>
        <nav>
            <div class="filtersoption">
                <p>Filtros</p>
                <div class="filters">
                    <button id="all">Todas</button>
                    <button id="pendentes">Pendentes</button>
                    <button id="concluidas">Concluidas</button>
                    <button id="maisrecente">Recentes</button>
                    <button id="menosrecente">Antigas</button>
                </div>
            </div>
        </nav>
       
        <section>
            <div class="controlers">
                <div class="taskmanageradd">
                    <input type="text" placeholder="nova tarefa..." id="newtask">
                    <input type="button" value="Adicionar" id="addnewtask">
                    <input type="button" value="Excluir Tudo" id="deleteall">
                </div>  
            </div>
            <ul id="ultasklist">    
            </ul>
        </section>
    </main>

    <footer>© 2026 Qevra. Todos os direitos reservados.</footer>
</body>
<script type="module" src="scripts/app.js"></script>
</html>
